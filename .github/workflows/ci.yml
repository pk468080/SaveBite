name: SaveBite CI

# Runs for pull requests targeting main, and for pushes to main.
# It does not run on feature-branch pushes alone, so a PR to main is
# the gate that must pass before merging.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest, Ruff, Mypy, pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: Run Ruff check and format check
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Run Mypy
        run: mypy app

      - name: Run pip-audit (runtime + dev)
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build Docker image (must fail on dependency errors)
        run: docker build -t savebite-api:ci ./backend

      - name: Smoke-test image health endpoint
        run: |
          docker run -d --rm --name savebite-ci -p 8000:8000 savebite-api:ci
          sleep 5
          curl --fail http://127.0.0.1:8000/health
          docker stop savebite-ci
